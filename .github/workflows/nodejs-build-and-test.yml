# Installs dependencies from the lockfile, runs the tests and builds the app.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: ./src/package-lock.json

    # The .npmrc release quarantine needs an npm that understands
    # min-release-age; the version bundled with Node may predate it.
    - name: Use a current npm
      run: npm install --global "npm@^11.6"

    - name: Install dependencies
      working-directory: ./src
      run: npm ci

    - name: Run tests
      working-directory: ./src
      run: npm test

    - name: Build the app
      working-directory: ./src
      run: npm run build
